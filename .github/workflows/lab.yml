name: lab

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: How many candidates to build
        default: "3"
      scout:
        description: Let an agent scout the web for ideas
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.LAB_NIGHTLY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm install -g @anthropic-ai/claude-code

      - name: Build tonight's batch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TELEMETRY_DISABLED: "1"
          LAB_BUILD_MODEL: ${{ vars.LAB_BUILD_MODEL || 'claude-sonnet-5' }}
          LAB_JUDGE_MODEL: ${{ vars.LAB_JUDGE_MODEL || 'claude-opus-5' }}
        run: |
          node scripts/lab-run.mjs \
            --count "${{ github.event.inputs.count || '3' }}" \
            --parallel 2 \
            --budget "${{ vars.LAB_BUDGET_PER_CANDIDATE || '2.5' }}" \
            ${{ github.event.inputs.scout == 'true' && '' || '--no-scout' }}

      - name: Open the batch as a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "lab"
          git config user.email "lab@herb.art"
          BRANCH="lab/$(date -u +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add src/app/lab taste .claude/skills/taste
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          BUILT=$(node -e 'const fs=require("fs");const d="src/app/lab";console.log(fs.existsSync(d)?fs.readdirSync(d).filter(s=>fs.existsSync(`${d}/${s}/experiment.json`)&&JSON.parse(fs.readFileSync(`${d}/${s}/experiment.json`)).status==="candidate").join(", "):"")')
          git commit -m "Lab batch: ${BUILT:-no new candidates}"
          git push -u origin "$BRANCH"
          gh pr create --fill --title "Lab batch $(date -u +%Y-%m-%d)" --body "Candidates: ${BUILT:-none}. Judge them at /taste."
          if [ "${{ vars.LAB_AUTO_MERGE }}" = "true" ]; then
            gh pr merge --squash --delete-branch || echo "merge deferred"
          fi
